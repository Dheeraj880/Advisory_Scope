version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, security]
    groups:
      python-dependencies:
        patterns: ["*"]

  # Keeps the commit-SHA pins on every GitHub Action up to date.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, security]
    groups:
      github-actions:
        patterns: ["*"]
