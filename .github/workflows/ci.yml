name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_eval:
        description: "Also run the live extraction eval (needs the ANTHROPIC_API_KEY secret)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - name: Offline end-to-end demo (scripted model, no API key)
        run: bash scripts/demo_offline.sh

  live-eval:
    if: github.event_name == 'workflow_dispatch' && inputs.live_eval
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Extract every golden advisory with the real model and diff against the golden record
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash scripts/eval_golden.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval-out/
