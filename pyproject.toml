[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "advisory-scope"
version = "0.1.0"
description = "Vendor advisory / CISA KEV entry -> validated affected-version scope (strict JSON) -> asset verdicts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Dheeraj Shaik" }]
keywords = ["vulnerability", "kev", "advisory", "detection-engineering", "llm", "json-schema"]
dependencies = [
  "anthropic>=0.60",
  "jsonschema>=4.21",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
advisory-scope = "advisory_scope.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/advisory_scope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
extend-exclude = [".semgrep"]
line-length = 120
target-version = "py310"
